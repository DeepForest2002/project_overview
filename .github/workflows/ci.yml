name: Node.js CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    name: Lint, Format, Build and Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4 Run ESLint
      - name: Run ESLint
        run: npm run lint

      # 5. Compile TypeScript
      - name: Build application
        run: npm run build

      # 7. Validate Docker Compose configuration
      - name: Validate Docker Compose
        run: docker compose config -q

      # 8. Build Docker image
      - name: Build Docker image
        run: docker compose up --build -d

  #CD stands for continious deployment
  deploy:
    name: Deploy on AWS ec2
    runs-on: ubuntu-latest

    needs: build-and-test

    #Deploy only to push req on master never on pull req
    if: github.event_name== 'push' && github.ref== 'refs/heads/master'

    steps:
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC_USER}}
          key: ${{secrets.EC2_KEY}}
          command_timeout: 10m
          script: |
            echo "Connected to AWS EC2 instance"
            cd /home/ec2-user/project_overview
            echo "Pulling latest code"
            git pull origin master
            echo "Rebuilding and starting docker container"
            docker compose up -d --build
            echo "Getting container logs"
            docker compose logs
            echo "Deployment is successfull"
