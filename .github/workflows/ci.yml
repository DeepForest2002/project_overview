name: Node.js CI Pipeline

# When should the workflow execute?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build TypeScript
      - name: Build application
        run: npm run build

      # 5. Run tests
      - name: Run tests
        run: npm test --if-present

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -t my-node-a
